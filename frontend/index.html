<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabelImg</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <button id="btn-open" title="Open Dir (Ctrl+U)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
      <span>Open Dir</span>
    </button>
    <button id="btn-save" title="Save (Ctrl+S)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm2 16H5V5h2v6h10V5h.17L19 6.83V19zM12 12a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM9 5h6v4H9V5z"/></svg>
      <span>Save</span>
    </button>
    <button id="btn-load-classes" title="Load classes.txt">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM7 13h10v2H7v-2zm0 4h10v2H7v-2z"/></svg>
      <span>Classes</span>
    </button>
    <div class="separator"></div>
    <button id="btn-prev" title="Prev Image (A)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      <span>Prev</span>
    </button>
    <button id="btn-next" title="Next Image (D)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      <span>Next</span>
    </button>
    <div class="separator"></div>
    <button id="btn-create" title="Create Box (W)" class="active">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      <span>Create</span>
    </button>
    <button id="btn-delete" title="Delete Box (Del)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>Delete</span>
    </button>
    <div class="separator"></div>
    <button id="btn-undo" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62A7.967 7.967 0 0 1 12.5 11c3.54 0 6.55 2.31 7.6 5.5l2.37-.78A10.005 10.005 0 0 0 12.5 8z"/></svg>
      <span>Undo</span>
    </button>
    <button id="btn-redo" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.4 10.6A9.954 9.954 0 0 0 11.5 8c-3.99 0-7.45 2.34-9.07 5.72l2.36.78A7.493 7.493 0 0 1 11.5 11c1.95 0 3.74.69 5.13 1.83L13 16h9V7l-3.6 3.6z"/></svg>
      <span>Redo</span>
    </button>
    <div class="separator"></div>
    <button id="btn-zoomin" title="Zoom In (+)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm.5-7H9v2H7v1h2v2h1v-2h2V9h-2z"/></svg>
      <span>Zoom+</span>
    </button>
    <button id="btn-zoomout" title="Zoom Out (-)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg>
      <span>Zoom-</span>
    </button>
    <button id="btn-fit" title="Fit Window (F)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 5h4V3H3v6h2V5zm0 14v-4H3v6h6v-2H5zm14 0h-4v2h6v-6h-2v4zm0-16h-6v2h4v4h2V3z"/></svg>
      <span>Fit</span>
    </button>
    <button id="btn-lock-zoom" title="锁定缩放比例：切换图片时保持当前缩放">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      <span>锁定缩放</span>
    </button>
    <div class="separator"></div>
    <button id="btn-pan" title="Pan Mode (H): drag image with left mouse">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M13 5.5a1.5 1.5 0 0 1 3 0V12h1V3.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-2a4 4 0 0 1-3.46-2L4.6 12.5a1.5 1.5 0 0 1 2.4-1.8l1.5 2V4a1.5 1.5 0 0 1 3 0v8h1V2.5a1.5 1.5 0 0 1 3 0V12h-1V5.5h-3z"/></svg>
      <span>Pan</span>
    </button>
    <button id="btn-copy-path" title="Copy current image path">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      <span>Copy Path</span>
    </button>
    <div class="separator"></div>
    <select id="format-select" title="Annotation Format">
      <option value="PascalVOC">PascalVOC</option>
      <option value="YOLO" selected>YOLO</option>
      <option value="CreateML">CreateML</option>
    </select>
  </div>

  <!-- Main Layout -->
  <div id="main">
    <!-- Canvas Area -->
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
      <div id="canvas-tooltip"></div>
      <div id="status-bar">
        <span id="status-file">No image loaded</span>
        <span id="status-pos"></span>
        <span id="status-zoom">100%</span>
        <span id="status-hint">Tip: double-click a box to change its label</span>
      </div>
    </div>

    <!-- Right Panel -->
    <div id="right-panel">
      <!-- Label Input -->
      <div class="panel-section">
        <div class="panel-header">Label</div>
        <div id="label-input-area">
          <input type="text" id="label-input" placeholder="Enter label..." list="label-suggestions" />
          <datalist id="label-suggestions"></datalist>
          <label id="default-label-toggle">
            <input type="checkbox" id="use-default-label" />
            <span>Use Default Label</span>
          </label>
        </div>
      </div>

      <!-- Labels List -->
      <div class="panel-section" id="labels-section">
        <div class="panel-header">Box Labels <span id="shape-count">(0)</span></div>
        <div class="panel-filter"><input type="text" id="labels-filter" placeholder="Filter labels..." /></div>
        <div id="labels-list"></div>
      </div>

      <!-- Stats Panel -->
      <div class="panel-section" id="stats-section">
        <div class="panel-header stats-header" id="stats-toggle">Stats <span id="stats-arrow">&#9654;</span></div>
        <div id="stats-content" style="display:none;">
          <div id="stats-summary"></div>
          <div id="stats-classes"></div>
        </div>
      </div>

      <!-- File List -->
      <div class="panel-section" id="files-section">
        <div class="panel-header">Files <span id="file-count">(0)</span></div>
        <div class="panel-filter"><input type="text" id="files-filter" placeholder="Filter files..." /></div>
        <div id="files-list"></div>
      </div>
    </div>
  </div>

  <!-- Label Dialog Modal -->
  <div id="label-dialog" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">Enter Label</div>
      <div id="dialog-label-combo">
        <input type="text" id="dialog-label-input" autocomplete="off" autofocus />
        <button type="button" id="dialog-label-dropdown-btn" title="Show existing labels">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="dialog-label-dropdown"></div>
      </div>
      <datalist id="dialog-label-suggestions"></datalist>
      <div class="modal-buttons">
        <button id="dialog-ok">OK</button>
        <button id="dialog-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="src/canvas.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
